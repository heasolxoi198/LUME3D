<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Contas - Controle Mensal</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f4; }
    h1 { color: #2c3e50; }
    .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    table { width: 100%; border-collapse: collapse; margin: 20px 0; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background: #3498db; color: white; }
    .pago { background: #d5f4e6; }
    .nao-pago { background: #ffe6e6; }
    button { padding: 8px 12px; margin: 2px; }
    .total { font-size: 1.3em; font-weight: bold; margin: 20px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>💰 Minhas Contas - Junho 2026</h1>
    
    <button onclick="adicionarConta()">+ Nova Conta</button>
    <button onclick="resetarMes()">🔄 Resetar Mês</button>

    <table id="tabela">
      <thead>
        <tr>
          <th>Conta</th>
          <th>Valor</th>
          <th>Vencimento</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="corpo-tabela"></tbody>
    </table>

    <div class="total">
      Total a pagar: <span id="total-apagar">R$ 0,00</span><br>
      Total pago: <span id="total-pago">R$ 0,00</span>
    </div>
  </div>

  <script>
    let contas = JSON.parse(localStorage.getItem('contas')) || [];

    function renderizarTabela() {
      const tbody = document.getElementById('corpo-tabela');
      tbody.innerHTML = '';

      let totalApagar = 0;
      let totalPago = 0;

      contas.forEach((conta, index) => {
        const pago = conta.pago;
        if (!pago) totalApagar += conta.valor;
        else totalPago += conta.valor;

        const tr = document.createElement('tr');
        tr.className = pago ? 'pago' : 'nao-pago';
        tr.innerHTML = `
          <td>${conta.nome}</td>
          <td>R$ ${conta.valor.toFixed(2)}</td>
          <td>${conta.vencimento}</td>
          <td>${pago ? '✅ Pago' : '⏳ Pendente'}</td>
          <td>
            <button onclick="togglePago(${index})">${pago ? 'Desmarcar' : 'Marcar como Pago'}</button>
            <button onclick="excluirConta(${index})">Excluir</button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('total-apagar').textContent = `R$ ${totalApagar.toFixed(2)}`;
      document.getElementById('total-pago').textContent = `R$ ${totalPago.toFixed(2)}`;
    }

    function adicionarConta() {
      const nome = prompt("Nome da conta (ex: Spotify):");
      if (!nome) return;
      
      const valor = parseFloat(prompt("Valor (R$):"));
      if (!valor) return;
      
      const vencimento = prompt("Dia do vencimento (ex: 10):");

      contas.push({
        nome,
        valor,
        vencimento,
        pago: false
      });

      salvarEAtualizar();
    }

    function togglePago(index) {
      contas[index].pago = !contas[index].pago;
      salvarEAtualizar();
    }

    function excluirConta(index) {
      if (confirm("Excluir esta conta?")) {
        contas.splice(index, 1);
        salvarEAtualizar();
      }
    }

    function salvarEAtualizar() {
      localStorage.setItem('contas', JSON.stringify(contas));
      renderizarTabela();
    }

    function resetarMes() {
      if (confirm("Resetar todas as contas para pendentes?")) {
        contas.forEach(c => c.pago = false);
        salvarEAtualizar();
      }
    }

    // Inicializar
    renderizarTabela();
  </script>
</body>
</html>
